<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="New">
  <title>New</title>
  <!--
    "NEW" written inside a red star, for fresh notices. Gentle, steady motion: the badge
    softly grows and settles, and a light passes across it. Nothing spins.
    Letters are drawn as lines (no font needed), so it looks the same in every browser.
    Solid colours only; motion stops for visitors who ask for reduced motion.
  -->
  <defs>
    <clipPath id="star-middle">
      <circle cx="32" cy="32" r="24.5" />
    </clipPath>
  </defs>
  <style>
    .badge { animation: breathe 2.4s ease-in-out infinite; transform-origin: 32px 32px; }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .sweep { animation: sweep 3s ease-in-out infinite; }
    @keyframes sweep {
      0% { transform: translateX(-20px) skewX(-20deg); }
      40%, 100% { transform: translateX(84px) skewX(-20deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .badge, .sweep { animation: none; }
      .sweep { opacity: 0; }
    }
  </style>

  <g class="badge">
    <!-- Star (points softened by a matching stroke) -->
    <polygon points="32.00,2.50 38.34,8.33 46.75,6.45 49.32,14.68 57.55,17.25 55.67,25.66 61.50,32.00 55.67,38.34 57.55,46.75 49.32,49.32 46.75,57.55 38.34,55.67 32.00,61.50 25.66,55.67 17.25,57.55 14.68,49.32 6.45,46.75 8.33,38.34 2.50,32.00 8.33,25.66 6.45,17.25 14.68,14.68 17.25,6.45 25.66,8.33" fill="#EF4444" stroke="#EF4444" stroke-width="1.6" stroke-linejoin="round" />

    <!-- Light passing across the middle of the star -->
    <g clip-path="url(#star-middle)">
      <rect class="sweep" x="0" y="-6" width="9" height="76" fill="#FFFFFF" fill-opacity=".22" />
    </g>

    <!-- Dotted ring -->
    <circle cx="32" cy="32" r="21.5" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="0.01 3.38" />

    <!-- N E W -->
    <g fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 39.5V24.5L21.75 39.5V24.5" />
      <path d="M31.25 24.5H25V39.5H31.25M25 32H30.25" />
      <path d="M34.5 24.5L37.6 39.5L42 28.5L46.4 39.5L49.5 24.5" />
    </g>
  </g>
</svg>
